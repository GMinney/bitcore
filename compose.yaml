# mongo can be pulled from the docker hub
# thoughtcore-node is built from the Dockerfile in the current directory using node from docker hub
# insight is built from the Dockerfile in the packages/insight directory using node from docker hub
# thought is built from the src repo using the ubuntu image

name: insight-services
services:
  mongo:
    container_name: mongo
    image: mongo:8.0.3-noble
    ports:
      - 27017:27017
    volumes:
      - /data/db:/data/db
    restart: unless-stopped

  thoughtcore-node:
    container_name: thoughtcore-node
    build: 
      context: .
      dockerfile: ./docker/thoughtcore-node/Dockerfile
    image: thoughtcore-node
    ports:
      - 8100:8100
      - 3004:3000
    links:
      - mongo
    environment:
      - DB_HOST=mongo
      - THOUGHTCORE_NODE_HTTP_PORT=3004
    env_file: .env
    restart: unless-stopped

  insight:
    container_name: insight
    build: 
      context: .
      dockerfile: ./docker/insight/Dockerfile
    image: insight
    ports:
      - 3000:3000
    links:
      - thoughtcore-node
    environment:
      - NODE_ENV=production
      - HOSTNAME="0.0.0.0"
      - PORT=3000
      - API_URL=thoughtcore-node
    restart: unless-stopped

